version: '3.8'

# ─── Shared Airflow block ─────────────────────────────────────────────────────
x-airflow-common:
  &airflow-common
  image: apache/airflow:2.9.0
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__WEBSERVER__SECRET_KEY: ${WEBSERVER_SECRET_KEY:-globalretail_secret_2024}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Runtime Python packages injected into every Airflow container
    _PIP_ADDITIONAL_REQUIREMENTS: >-
      pymongo[srv]==4.6.3
      pandas==2.1.4
      requests==2.31.0
      dnspython==2.6.1
      numpy==1.26.4
      openpyxl==3.1.2
    # Application environment variables
    MONGO_URI: ${MONGO_URI}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # Metadata database for Airflow
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # One-shot initialisation: runs DB migration + creates admin user then exits
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "--- Creating data/tmp directory ---"
        mkdir -p /opt/airflow/data/tmp
        echo "--- Running DB migration ---"
        airflow db migrate
        echo "--- Creating admin user ---"
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --firstname Admin \
          --lastname Admin \
          --role Admin \
          --email admin@globalretail.com \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" || echo "User already exists."
        echo "--- Airflow initialisation complete ---"
    environment:
      <<: *airflow-common-env
    user: "0:0"

  # Serves the Airflow UI on http://localhost:8080
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Parses DAGs and schedules task instances
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
